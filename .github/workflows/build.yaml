name: ci

on:
  push:
    branches:
      - "main"
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install audio libraries
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libsndfile1 ffmpeg
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install Python test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu torch==2.1.0
          pip install \
            pytest \
            numpy==1.26.4 \
            scipy==1.15.3 \
            pyyaml==6.0.2 \
            librosa==0.11.0 \
            soxr==0.5.0.post1 \
            soundfile==0.13.1 \
            fastapi==0.121.3 \
            "uvicorn[standard]==0.38.0" \
            python-multipart==0.0.20 \
            httpx==0.28.1 \
            pydub==0.25.1 \
            tensorboard==2.20.0
      - name: Pytest
        run: python -m pytest tests/ -q --tb=short
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Frontend build
        working-directory: web
        run: npm ci && npm run build

  docker:
    runs-on: ubuntu-latest-8-cores
    if: github.event_name == 'push'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PAT }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: cloud
          endpoint: "semtex87/bob-the-builder"
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          tags: "${{ vars.DOCKER_USER }}/a2sb-upscaler:latest"
          cache-from: type=registry,ref=${{ vars.DOCKER_USER }}/a2sb-upscaler:buildcache
          cache-to: type=registry,ref=${{ vars.DOCKER_USER }}/a2sb-upscaler:buildcache,mode=max
          outputs: type=registry
